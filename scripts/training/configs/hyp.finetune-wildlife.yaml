# YOLOv5 hyperparameters for wildlife 225-class fine-tuning
# Base: hyp.scratch-low.yaml; adjustments for transfer learning on wildlife imagery.
# Used with: python train.py --hyp scripts/training/configs/hyp.finetune-wildlife.yaml

# --- Optimizer ---
lr0: 0.001          # initial LR (AdamW — 10x lower than SGD default 0.01)
lrf: 0.01           # final LR = lr0 * lrf = 1e-5
momentum: 0.937     # SGD momentum / AdamW beta1 (kept for fallback SGD)
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# --- Loss gains ---
box: 0.05           # box regression loss gain
cls: 0.5            # classification loss gain (YOLOv5 scales internally by nc/80 ≈ 2.8 → effective ~1.41)
                    # monitor after epoch 5: if cls >> 2x box+obj, reduce to 0.3
obj: 1.0            # objectness loss gain
label_smoothing: 0.1 # prevents head-class overconfidence with 225-class vocabulary
iou_t: 0.20         # IoU threshold for anchor assignment
anchor_t: 4.0       # anchor-multiple threshold
fl_gamma: 0.0       # focal loss gamma (0 = off)

# --- Augmentation ---
hsv_h: 0.015        # hue jitter — outdoor lighting varies
hsv_s: 0.7          # saturation jitter
hsv_v: 0.4          # brightness jitter — dawn/dusk images
degrees: 0.0        # rotation disabled — wildlife images are upright; rotation artifacts harm boxes
translate: 0.1      # translation — moderate
scale: 0.5          # scale — important for multi-distance animal detection
shear: 0.0          # shear disabled
perspective: 0.0    # perspective warp disabled — introduces artifacts
flipud: 0.0         # vertical flip disabled — animals are gravity-bound
fliplr: 0.5         # horizontal flip — valid for wildlife
mosaic: 1.0         # 4-image mosaic — increases effective context variety, especially for tail classes
mixup: 0.0          # MixUp disabled for baseline
copy_paste: 0.0     # copy-paste disabled (requires instance masks)
