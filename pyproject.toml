[project]
name = "wildlife-training"
version = "0.1.0"
description = "Training environment for wildlife object detection — KD pipeline for embedded inference"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Core DL stack — CUDA wheels resolved via [tool.uv.sources]
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    # Object detection — covers YOLOv8s, YOLO11n, YOLOv10n, YOLO12n, RT-DETR-L
    "ultralytics>=8.4.33",
    # Wildlife domain — MegaDetector v5 wrapper + SpeciesNet classifier
    "PytorchWildlife>=1.2.4",
    # PytorchWildlife's bioacoustics module imports these unconditionally
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "speciesnet>=5.0.5",
    # Training utilities
    "pytorch-lightning>=2.6.1",
    "mlflow>=3.0.0",
    "torchmetrics>=1.4.0",
    "pycocotools>=2.0.7",
    # YOLOv5 — model definition, ComputeLoss, NMS (we own training loop / data / eval)
    "yolov5>=7.0.13",
    # Data & vision
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    # headless: no Qt/GTK GUI deps — functionally identical for all script usage
    "opencv-python-headless>=4.10.0",
    "tqdm>=4.66.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    # Evaluation — interactive visualization of predictions vs ground truth
    "fiftyone>=1.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "psutil>=6.0.0",
    "google-genai>=2.14.0",
    "openai>=2.48.0",
    "tiktoken>=0.13.0",
    # Local text-to-image generation (synthetic-model-comparison experiment's
    # local-model tier: FLUX.1-schnell, RealVisXL+SDXL-Lightning, SD 3.5 Medium)
    "diffusers>=0.31.0",
    "transformers>=4.46.0",
    "accelerate>=1.1.0",
    "bitsandbytes>=0.43.0",
    "sentencepiece>=0.2.0",
    "protobuf>=5.28.0",
    "peft>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=25.0.0",
    "isort>=6.0.0",
]

# NanoDet and PaddlePaddle (PicoDet) are intentionally excluded — they have
# incompatible build systems and are managed in separate environments.
# See docs/progress_notes/2026-04-24_training-setup-and-model-smoke-test.md

[tool.uv]
# Restrict resolution to Linux — the training environment never runs on macOS.
# Without this, speciesnet's macOS-only numpy<2.0 constraint conflicts with
# numpy>=2.0.0. On Linux speciesnet has no numpy upper bound.
environments = ["sys_platform == 'linux'"]
# speciesnet 5.x pins yolov5<7.0.12 but 7.0.13 is API-compatible — keep the
# installed version rather than downgrading.
override-dependencies = ["yolov5>=7.0.13"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu",   marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu",   marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
